# Holm: the smallest useful config. Copy it to config.yml and list your
# apps. Everything left out is off or on its default (web search through Google).
# config.example.yml lists every option.
#
# There is no sign-in: everyone who opens Holm is the same Guest and shares
# one page, plus any integration you connect later. Keep it on your own
# network, or add the auth: block from config.example.yml for per-person
# pages and groups.

# The Configure panel and drag-to-arrange. Off when this block is missing.
customization:
  enabled: true

# The daily wallpaper and the weather pill. Both are off when missing.
wallpapers:
  enabled: true
weather:
  enabled: true

apps:
  - id: jellyfin
    name: Jellyfin
    url: "https://jellyfin.example.com"
    icon: "di:jellyfin"
    self_hosted: true                         # shows it on the page
  - id: proxmox
    name: Proxmox
    url: "https://pve.example.com"
    icon: "di:proxmox"
    self_hosted: true
